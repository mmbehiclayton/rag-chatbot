# nginx site for elimu.edupro.co.ke → elimu-app container on 127.0.0.1:3001.
# Install: docs/deploy-vps.md, "nginx and TLS". Certbot adds the 443 server and
# the HTTP→HTTPS redirect to this file; keep the location blocks in step with it.
#
# The zones are named elimu_* so they don't share counters with EduPro's zones.
limit_req_zone  $binary_remote_addr zone=elimu_general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=elimu_auth:10m    rate=30r/m;
limit_conn_zone $binary_remote_addr zone=elimu_addr:10m;

server {
    listen 80;
    listen [::]:80;
    server_name elimu.edupro.co.ke;

    # Server actions accept PDFs up to 50 MB (next.config.ts bodySizeLimit)
    client_max_body_size 50m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn elimu_addr 100;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Chat answers and generations stream token by token: don't hold them back,
    # and allow the 300 s the generation pages are given (maxDuration).
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      310s;
    proxy_send_timeout      310s;

    # Sign-in, sign-up and password pages (server actions POST to the page URL)
    location ~ ^/(login|register|forgot-password|reset-password)$ {
        limit_req zone=elimu_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    # Hashed build assets never change, so let browsers keep them
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        limit_req zone=elimu_general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }
}
