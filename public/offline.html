<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d72ef" />
    <title>No connection | Elimu</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f5f6f8;
        color: #1f2937;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 360px;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 12px 0 8px;
      }
      p {
        font-size: 0.875rem;
        color: #6b7280;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: #0d72ef;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>
        Elimu needs the internet to open your work. Check your data or Wi-Fi,
        then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
